name: Legacy branding cleanup

on:
  push:
    branches:
      - chore/remove-legacy-cms-branding

permissions:
  actions: read
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download verified cleanup patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 31961971495 -n verified-branding-cleanup

      - name: Apply verified cleanup without workflow changes
        shell: bash
        run: |
          set -e
          git apply --binary cleanup.patch
          git checkout HEAD -- .github/workflows/ci.yml .github/workflows/release.yml

      - name: Validate source after cleanup
        shell: bash
        run: |
          set -e
          find app config database scripts tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          npm ci
          npm run check:assets
          php tests/run.php

      - name: Verify former branding outside workflows is gone
        shell: bash
        run: |
          set -e
          if grep -RInE --exclude-dir=.git --exclude-dir=.github '(ArtStudio|artstudio[.:_/-]|ASDR CMS|asdr-browser-tests|https://asdr\.gov\.uz)' .; then
            echo 'Former branding still present outside workflows.' >&2
            exit 1
          fi

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(branding): remove legacy CMS identity'
          git push origin HEAD:chore/remove-legacy-cms-branding
